<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><rect width="390" height="844" fill="#F8F3E8"/><text x="24" y="57" fill="#183A31" font-family="-apple-system" font-size="31">‹</text><text x="293" y="55" fill="#B85639" font-family="-apple-system" font-size="12" font-weight="700" letter-spacing="1.6">PRIVACY</text><text x="24" y="128" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">Photo access</text><text x="24" y="172" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">is off.</text><g font-family="-apple-system"><rect x="24" y="220" width="342" height="126" rx="18" fill="#FFFCF6" stroke="#B85639"/><text x="48" y="257" fill="#183A31" font-size="17" font-weight="700">You can still make an archive.</text><text x="48" y="285" fill="#64756C" font-size="14">Choose photos manually, or enable access</text><text x="48" y="306" fill="#64756C" font-size="14">in Settings. Your choices stay private.</text><rect x="24" y="365" width="342" height="52" rx="14" fill="#FFFCF6" stroke="#183A31"/><text x="108" y="398" fill="#183A31" font-size="16" font-weight="700">Open Settings</text></g><rect x="24" y="695" width="342" height="56" rx="16" fill="#183A31"/><text x="48" y="730" fill="#FFFCF6" font-family="-apple-system" font-size="17" font-weight="700">Choose photos manually</text><text x="334" y="733" fill="#FFFCF6" font-size="26">→</text></svg>
