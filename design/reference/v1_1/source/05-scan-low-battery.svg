<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><rect width="390" height="844" fill="#183A31"/><text x="24" y="57" fill="#F8F3E8" font-size="31">‹</text><text x="244" y="55" fill="#F8F3E8" font-family="-apple-system" font-size="12" font-weight="700">ON-DEVICE SCAN</text><text x="24" y="145" fill="#FFFDF6" font-family="Georgia" font-size="40">Looking through</text><text x="24" y="188" fill="#FFFDF6" font-family="Georgia" font-size="40">the moments.</text><circle cx="195" cy="324" r="87" fill="none" stroke="#58776B" stroke-width="15"/><text x="164" y="330" fill="#FFFDF6" font-family="-apple-system" font-size="31" font-weight="700">62%</text><rect x="24" y="458" width="342" height="119" rx="18" fill="#EFE4D1" stroke="#B85639"/><text x="49" y="495" fill="#183A31" font-family="-apple-system" font-size="17" font-weight="700">Battery is low.</text><text x="49" y="522" fill="#64756C" font-family="-apple-system" font-size="14">You can pause now and continue later.</text><text x="49" y="546" fill="#64756C" font-family="-apple-system" font-size="14">Tailor will not stop or resume without your choice.</text><rect x="24" y="722" width="342" height="56" rx="16" fill="#F8F3E8"/><text x="48" y="757" fill="#183A31" font-family="-apple-system" font-size="17" font-weight="700">Pause scan</text><text x="329" y="758" fill="#183A31" font-size="20">Ⅱ</text></svg>
