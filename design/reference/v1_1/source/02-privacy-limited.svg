<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><rect width="390" height="844" fill="#F8F3E8"/><text x="24" y="57" fill="#183A31" font-family="-apple-system" font-size="31">‹</text><text x="293" y="55" fill="#B85639" font-family="-apple-system" font-size="12" font-weight="700" letter-spacing="1.6">PRIVACY</text><text x="24" y="128" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">Your photos</text><text x="24" y="172" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">stay yours.</text><g font-family="-apple-system"><rect x="24" y="218" width="342" height="118" rx="18" fill="#EFE4D1" stroke="#B85639"/><text x="48" y="253" fill="#183A31" font-size="17" font-weight="700">You chose limited photo access.</text><text x="48" y="279" fill="#64756C" font-size="14">Tailor can only search the photos</text><text x="48" y="300" fill="#64756C" font-size="14">you selected. You can change this anytime.</text><rect x="24" y="358" width="342" height="64" rx="16" fill="#FFFCF6" stroke="#DED4C1"/><text x="48" y="397" fill="#183A31" font-size="16" font-weight="700">Manage selected photos</text></g><rect x="24" y="695" width="342" height="56" rx="16" fill="#183A31"/><text x="48" y="730" fill="#FFFCF6" font-family="-apple-system" font-size="17" font-weight="700">Continue with selected photos</text><text x="334" y="733" fill="#FFFCF6" font-size="26">→</text><text x="77" y="792" fill="#64756C" font-family="-apple-system" font-size="13">You can add more photos later in Settings.</text></svg>
