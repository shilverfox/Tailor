<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><rect width="390" height="844" fill="#F8F3E8"/><text x="24" y="57" fill="#183A31" font-family="-apple-system" font-size="31">‹</text><text x="293" y="55" fill="#B85639" font-family="-apple-system" font-size="12" font-weight="700" letter-spacing="1.6">PRIVACY</text><text x="24" y="128" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">Your photos</text><text x="24" y="172" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="40">stay yours.</text><text x="24" y="209" fill="#64756C" font-family="-apple-system" font-size="16">Tailor asks only for the access you choose.</text><g font-family="-apple-system"><g fill="#FFFCF6" stroke="#DED4C1"><rect x="24" y="244" width="342" height="64" rx="16"/><rect x="24" y="320" width="342" height="64" rx="16"/><rect x="24" y="396" width="342" height="64" rx="16"/><rect x="24" y="478" width="342" height="84" rx="18"/></g><g fill="#183A31" font-size="16" font-weight="700"><text x="58" y="283">Processed on this device</text><text x="58" y="359">Your whole album is never uploaded</text><text x="58" y="435">Only photos you approve are used</text><text x="44" y="514">Limited access is okay</text></g><text x="44" y="539" fill="#64756C" font-size="14">Results will only include the photos you select.</text></g><rect x="24" y="695" width="342" height="56" rx="16" fill="#183A31"/><text x="48" y="730" fill="#FFFCF6" font-family="-apple-system" font-size="17" font-weight="700">Allow photo access</text><text x="334" y="733" fill="#FFFCF6" font-size="26">→</text><text x="101" y="792" fill="#B85639" font-family="-apple-system" font-size="14" font-weight="700">Choose photos manually instead</text></svg>
