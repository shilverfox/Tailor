<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><rect width="390" height="844" fill="#F8F3E8"/><text x="24" y="57" fill="#183A31" font-family="-apple-system" font-size="31">‹</text><text x="207" y="55" fill="#B85639" font-family="-apple-system" font-size="12" font-weight="700" letter-spacing="1.2">REFERENCE PHOTOS</text><text x="24" y="128" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="39">Help us recognize</text><text x="24" y="171" fill="#183A31" font-family="Iowan Old Style,Georgia" font-size="39">them.</text><text x="24" y="208" fill="#64756C" font-family="-apple-system" font-size="16">Choose 3–5 clear photos from different ages</text><text x="24" y="230" fill="#64756C" font-family="-apple-system" font-size="16">and angles.</text><g stroke="#DED4C1"><rect x="24" y="262" width="100" height="134" rx="18" fill="#D8DFCB"/><rect x="134" y="262" width="100" height="134" rx="18" fill="#B85639"/><rect x="244" y="262" width="100" height="134" rx="18" fill="#183A31"/><rect x="24" y="410" width="100" height="134" rx="18" fill="#FFFCF6" stroke-dasharray="5 4"/></g><g fill="#FFFCF6" font-family="-apple-system" font-size="24" font-weight="700"><text x="102" y="292">×</text><text x="212" y="292">×</text><text x="322" y="292">×</text></g><text x="54" y="482" fill="#64756C" font-family="-apple-system" font-size="28">＋</text><text x="31" y="570" fill="#183A31" font-family="-apple-system" font-size="14" font-weight="700">3 of 3 minimum selected</text><rect x="24" y="594" width="342" height="79" rx="18" fill="#FFFCF6" stroke="#DED4C1"/><text x="46" y="626" fill="#183A31" font-family="-apple-system" font-size="15" font-weight="700">A helpful mix</text><text x="46" y="650" fill="#64756C" font-family="-apple-system" font-size="13">Different ages and angles make matching more reliable.</text><rect x="24" y="715" width="342" height="56" rx="16" fill="#183A31"/><text x="48" y="750" fill="#FFFCF6" font-family="-apple-system" font-size="17" font-weight="700">Start looking</text><text x="334" y="753" fill="#FFFCF6" font-size="26">→</text></svg>
