<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <title>APPROVED · Warm Paper · closing</title>
  <desc>Production-default geometry. Images are non-user QA assets. Warm Paper automatic rotation 0 degrees.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 0.34"/></feComponentTransfer>
    </filter>
    <clipPath id="paper-clip"><rect x="17.5" y="17.5" width="560" height="807"/></clipPath>
  </defs>
  <rect id="backdrop" width="595" height="842" fill="#EFE4D1"/>
  <rect id="paper" x="17.5" y="17.5" width="560" height="807" fill="#F8F3E8"/>
  <rect id="warm-paper-texture-opacity-034" x="17.5" y="17.5" width="560" height="807" fill="#8D7D68" filter="url(#paper-grain)" clip-path="url(#paper-clip)" opacity="0.18"/>
  <g id="automatic-content">
    
    
    <line id="clay-accent" x1="62.3" y1="610.64" x2="101.5" y2="610.64" stroke="#B85639" stroke-width="2"/>
    <text id="subtitle" x="62.3" y="168.96" fill="#64756C" font-family="Helvetica, Arial, sans-serif" font-size="14.56">Tailor never changes your original photos.</text>
    <text id="title" x="62.3" y="106.25" fill="#183A31" font-family="Iowan Old Style, IowanOldStyle-Roman, Georgia, serif" font-size="25.2">Kept with care.</text>
  </g>
</svg>