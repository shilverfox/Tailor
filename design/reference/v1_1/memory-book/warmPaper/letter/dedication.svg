<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <title>APPROVED · Warm Paper · dedication</title>
  <desc>Production-default geometry. Images are non-user QA assets. Warm Paper automatic rotation 0 degrees.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 0.34"/></feComponentTransfer>
    </filter>
    <clipPath id="paper-clip"><rect x="18" y="18" width="576" height="756"/></clipPath>
  </defs>
  <rect id="backdrop" width="612" height="792" fill="#EFE4D1"/>
  <rect id="paper" x="18" y="18" width="576" height="756" fill="#F8F3E8"/>
  <rect id="warm-paper-texture-opacity-034" x="18" y="18" width="576" height="756" fill="#8D7D68" filter="url(#paper-grain)" clip-path="url(#paper-clip)" opacity="0.18"/>
  <g id="automatic-content">
    
    
    <line id="clay-accent" x1="64.08" y1="573.66" x2="104.4" y2="573.66" stroke="#B85639" stroke-width="2"/>
    <text id="subtitle" x="64.08" y="161.2" fill="#64756C" font-family="Helvetica, Arial, sans-serif" font-size="14.98">Made privately from the photographs you chose.</text>
    <text id="title" x="64.08" y="103.36" fill="#183A31" font-family="Iowan Old Style, IowanOldStyle-Roman, Georgia, serif" font-size="25.92">For Milo</text>
  </g>
</svg>