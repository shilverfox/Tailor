<!-- 01 editor --> <g transform="translate(50,80)"><rect class="phone" width="350" height="820" rx="38"/><rect class="work" x="6" y="6" width="338" height="808" rx="32"/><text x="32" y="67" class="white small">‹</text><text x="128" y="67" class="white small">4 OF 18</text><text x="286" y="67" class="clay small">•••</text><rect class="paper" x="58" y="125" width="234" height="332"/><text x="76" y="156" class="clay small" font-size="10">2020–2021</text><text x="76" y="198" class="ink pageh">Days together</text><text x="76" y="222" class="muted" font-size="11">A few pages from the days you chose.</text><rect x="76" y="255" width="198" height="172" fill="#5a7267"/><ellipse cx="176" cy="318" rx="43" ry="56" fill="#efe8db"/><ellipse cx="176" cy="376" rx="67" ry="40" fill="#e5ded0"/><rect x="72" y="251" width="206" height="180" fill="none" stroke="#bd5a3c" stroke-width="3"/><circle cx="72" cy="251" r="6" class="clay"/><circle cx="278" cy="251" r="6" class="clay"/><circle cx="72" cy="431" r="6" class="clay"/><circle cx="278" cy="431" r="6" class="clay"/><line x1="175" y1="125" x2="175" y2="457" stroke="#bd5a3c" stroke-opacity=".55"/><line x1="58" y1="291" x2="292" y2="291" stroke="#bd5a3c" stroke-opacity=".55"/><rect x="6" y="530" width="338" height="59" fill="#14352e"/><rect x="24" y="540" width="38" height="42" class="sage"/><rect x="72" y="540" width="38" height="42" class="sage"/><rect x="120" y="540" width="38" height="42" class="sage"/><rect x="168" y="540" width="38" height="42" class="paper" stroke="#bd5a3c" stroke-width="3"/><rect class="paper" x="6" y="589" width="338" height="225" rx="22"/><text x="31" y="642" class="cap">▦</text><text x="91" y="642" class="cap">▤</text><text x="152" y="642" class="clay cap">▣</text><text x="218" y="642" class="cap">T</text><text x="283" y="642" class="cap">◐</text><text x="21" y="667" class="ui">Pages</text><text x="77" y="667" class="ui">Layout</text><text x="143" y="667" class="ui">Photo</text><text x="213" y="667" class="ui">Text</text><text x="273" y="667" class="ui">Style</text><rect x="23" y="699" width="87" height="34" rx="8" fill="#fffdf8" stroke="#ddd5c5"/><text x="34" y="721" class="ui" font-size="13">Crop</text><rect x="120" y="699" width="91" height="34" rx="8" fill="#fffdf8" stroke="#ddd5c5"/><text x="132" y="721" class="ui" font-size="13">Replace</text><rect x="221" y="699" width="99" height="34" rx="8" fill="#fffdf8" stroke="#ddd5c5"/><text x="233" y="721" class="ui" font-size="13">Remove</text></g><text x="50" y="945" class="cap">E02 · Page editor</text><text x="50" y="972" class="caption">Selected image, safe-area guides and contextual Photo tools.</text>
<!-- 02 crop --> <g transform="translate(450,80)"><rect class="phone" width="350" height="820" rx="38"/><rect class="work" x="6" y="6" width="338" height="808" rx="32"/><text x="28" y="67" class="white ui">Cancel</text><text x="198" y="67" class="clay small">CROP PHOTO</text><rect x="34" y="120" width="282" height="542" fill="#5a7267"/><ellipse cx="175" cy="280" rx="78" ry="101" fill="#efe8db"/><ellipse cx="175" cy="440" rx="118" ry="82" fill="#e5ded0"/><rect x="58" y="250" width="234" height="260" fill="none" stroke="#bd5a3c" stroke-width="3"/><path d="M34 120H316V662H34z M58 250H292V510H58z" fill="#112d27" fill-rule="evenodd" fill-opacity=".7"/><text x="73" y="720" class="white ui">Drag to reposition · pinch to zoom</text><rect x="25" y="755" width="106" height="42" rx="12" fill="none" stroke="#f8f3e8"/><text x="52" y="782" class="white ui">Reset</text><rect x="142" y="755" width="180" height="42" rx="12" class="clay"/><text x="207" y="782" class="white ui">Done</text></g><text x="450" y="945" class="cap">E04 · Crop mode</text><text x="450" y="972" class="caption">Image moves inside a fixed page frame; cancel and done are explicit.</text>
<!-- 03 pages --> <g transform="translate(850,80)"><rect class="phone" width="350" height="820" rx="38"/><rect class="work" x="6" y="6" width="338" height="808" rx="32"/><text x="29" y="67" class="white small">‹</text><text x="135" y="67" class="white small">PAGES</text><rect class="paper" x="6" y="385" width="338" height="429" rx="25"/><rect x="142" y="402" width="56" height="5" rx="3" fill="#b7b6aa"/><text x="25" y="452" class="ink h">Pages</text><text x="25" y="480" class="muted">Move photo and note pages. Structural pages stay in place.</text><g transform="translate(25,505)"><rect width="84" height="116" rx="7" class="sage"/><text x="10" y="24" class="small ink">MILO</text><text x="64" y="19" class="ui">⌁</text><rect x="100" width="84" height="116" rx="7" class="paper" stroke="#ddd5c5"/><text x="110" y="24" class="ui">Contents</text><text x="164" y="19" class="ui">⌁</text><rect x="200" width="84" height="116" rx="7" class="paper" stroke="#ddd5c5"/><text x="209" y="24" class="ui">Chapter</text><text x="264" y="19" class="ui">⌁</text><rect y="134" width="84" height="116" rx="7" class="paper" stroke="#bd5a3c" stroke-width="3"/><text x="10" y="157" class="ui">Days</text><rect x="10" y="176" width="64" height="60" fill="#536b60"/><rect x="100" y="134" width="84" height="116" rx="7" class="paper" stroke="#ddd5c5"/><text x="110" y="157" class="ui">Days</text><rect x="110" y="176" width="64" height="60" fill="#536b60"/><rect x="200" y="134" width="84" height="116" rx="7" class="paper" stroke="#ddd5c5"/><text x="210" y="157" class="ui">Note</text></g><rect x="25" y="778" width="130" height="28" rx="8" fill="#fffdf8" stroke="#ddd5c5"/><text x="42" y="798" class="ui">＋ Photo page</text><rect x="165" y="778" width="77" height="28" rx="8" fill="#fffdf8" stroke="#ddd5c5"/><text x="177" y="798" class="ui">Duplicate</text></g><text x="850" y="945" class="cap">E03 · Page manager</text><text x="850" y="972" class="caption">Fixed structural pages are visible and locked; editable pages can be reordered.</text>
<!-- 04 preview --> <g transform="translate(1250,80)"><rect class="phone" width="350" height="820" rx="38"/><rect class="paper" x="6" y="6" width="338" height="808" rx="32"/><text x="30" y="67" class="ink small">‹</text><text x="248" y="67" class="clay small">8 / 18</text><text x="25" y="114" class="clay small">READING PREVIEW</text><rect x="45" y="150" width="260" height="367" class="paper" stroke="#ddd5c5"/><text x="68" y="187" class="clay small">2020–2021</text><text x="68" y="232" class="ink pageh">Days<br/>together</text><rect x="68" y="280" width="214" height="190" fill="#536b60"/><ellipse cx="175" cy="342" rx="44" ry="58" fill="#f1eadd"/><ellipse cx="175" cy="414" rx="69" ry="42" fill="#e5ded0"/><text x="47" y="380" fill="#163d33" fill-opacity=".15" style="font:900 23px Arial;letter-spacing:2px" transform="rotate(-34 47 380)">TAILOR · PREVIEW</text><rect x="25" y="587" width="300" height="92" rx="15" fill="#fffdf8" stroke="#ddd5c5"/><text x="45" y="622" class="ink ui">⌁  Every page is watermarked.</text><text x="45" y="650" class="muted">Your book remains fully editable.</text><rect x="25" y="704" width="300" height="53" rx="16" class="ink"/><text x="46" y="738" class="white ui">Unlock full album · $19.99</text><text x="292" y="738" class="white ui">→</text><text x="119" y="789" class="clay ui">Back to edit</text></g><text x="1250" y="945" class="cap">E08 · Reading preview</text><text x="1250" y="972" class="caption">Reading removes all editor controls; free samples use repeated low-contrast watermarks.</text>
<!-- 05 export --> <g transform="translate(1650,80)"><rect class="phone" width="350" height="820" rx="38"/><rect class="paper" x="6" y="6" width="338" height="808" rx="32"/><text x="30" y="67" class="ink small">‹</text><text x="240" y="67" class="clay small">EXPORT</text><circle cx="175" cy="180" r="31" class="sage"/><text x="160" y="192" class="ink" style="font:30px Arial">✓</text><text x="85" y="265" class="ink h">Your archive</text><text x="110" y="303" class="ink h">is ready.</text><text x="55" y="335" class="muted">Saved privately on this iPhone.</text><rect x="117" y="370" width="116" height="170" class="paper" stroke="#ddd5c5"/><text x="133" y="400" class="clay small">TAILOR</text><text x="133" y="432" class="ink pageh">Milo</text><rect x="133" y="455" width="84" height="65" fill="#536b60"/><text x="80" y="578" class="clay small">18 PAGES · US LETTER · TODAY</text><rect x="25" y="625" width="300" height="53" rx="16" class="ink"/><text x="48" y="659" class="white ui">Save and share PDF</text><text x="288" y="659" class="white ui">↗</text><rect x="25" y="691" width="300" height="53" rx="16" fill="none" stroke="#163d33"/><text x="120" y="725" class="ink ui">Open in archive</text></g><text x="1650" y="945" class="cap">E09 · Export complete</text><text x="1650" y="972" class="caption">Cover, page count, paper size and persistent archive access are explicit.</text>
