<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1060" viewBox="0 0 2080 1060">
<style>.bg{fill:#e7e4dc}.phone{fill:#f8f3e8;stroke:#18211e;stroke-width:12}.work{fill:#112d27}.paper{fill:#f8f3e8}.ink{fill:#163d33}.clay{fill:#bd5a3c}.sage{fill:#dce4d0}.line{stroke:#ddd5c5}.small{font:700 15px Arial;letter-spacing:2px}.ui{font:600 19px Arial}.h{font:400 38px Georgia}.pageh{font:400 29px Georgia}.muted{fill:#69766e;font:17px Arial}.white{fill:#f8f3e8}.cap{font:700 22px Arial;fill:#163d33}.caption{font:16px Arial;fill:#5f6c64}</style>
