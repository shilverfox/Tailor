<text x="70" y="650" class="name">Shared rendering rules</text><text x="70" y="685" class="sub">1. Safe zone and normalized element frames map to A4 and US Letter.   2. Images use the same Fill + crop transform.   3. Preview and PDF use identical background, typography, watermark and page order tokens.</text><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#191919"/><stop offset="1" stop-color="#d0d0d0"/></linearGradient></defs></svg>
