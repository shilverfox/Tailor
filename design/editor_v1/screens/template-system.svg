<g transform="translate(660,165)"><rect width="238" height="388" class="page" fill="#dce4d0"/><rect x="17" y="18" width="204" height="352" class="safe"/><text x="29" y="58" class="cap">FIELD NOTES</text><rect x="29" y="82" width="85" height="30" rx="8" fill="#f8f3e8"/><text x="39" y="102" class="name" font-size="12">2020–2021</text><rect x="29" y="133" width="180" height="158" fill="#587064"/><text x="29" y="327" class="sub" font-size="14">A note in your own words.</text><text x="0" y="425" class="name">Field Notes</text><text x="0" y="452" class="note">Sage / date card / hand-note</text></g>
