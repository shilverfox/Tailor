<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<style>.title{font:400 43px Georgia;fill:#163d33}.sub{font:18px Arial;fill:#69766e}.name{font:700 19px Arial;fill:#163d33}.note{font:15px Arial;fill:#69766e}.cap{font:700 13px Arial;letter-spacing:1.5px;fill:#bd5a3c}.page{stroke:#ddd5c5;stroke-width:2}.safe{fill:none;stroke:#bd5a3c;stroke-width:2;stroke-dasharray:6 5}.label{font:13px Arial;fill:#bd5a3c}</style><rect width="1600" height="760" fill="#e7e4dc"/><text x="70" y="75" class="title">Tailor PageStyle system</text><text x="70" y="110" class="sub">Template tokens change the page language — never user photo position, crop, words or page order.</text>
<g transform="translate(70,165)"><rect width="238" height="388" class="page" fill="#f8f3e8"/><rect x="17" y="18" width="204" height="352" class="safe"/><text x="29" y="58" class="cap">WARM PAPER</text><text x="29" y="105" class="title" font-size="27">Days together</text><rect x="29" y="152" width="180" height="180" fill="#587064"/><text x="0" y="425" class="name">Warm Paper</text><text x="0" y="452" class="note">Paper / Ink / clay emphasis</text></g>
